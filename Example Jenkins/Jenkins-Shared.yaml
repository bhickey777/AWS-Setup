AWSTemplateFormatVersion: '2010-09-09'
Description: Hello World Wealth shared Jenkins controller (classroom starter; instructor managed).
Parameters:
  AdminCidr:
    Type: String
    Description: Instructor public IPv4 CIDR, e.g. 203.0.113.5/32
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
  InstanceType:
    Type: String
    Default: t3.large
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  JenkinsVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.90.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: hww-jenkins-vpc}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref JenkinsVpc, InternetGatewayId: !Ref InternetGateway}
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref JenkinsVpc
      CidrBlock: 10.90.1.0/24
      MapPublicIpOnLaunch: true
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref JenkinsVpc}
  PublicInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties: {RouteTableId: !Ref PublicRoutes, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PublicRoutes, SubnetId: !Ref PublicSubnet}
  JenkinsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Instructor-only Jenkins and SSH
      VpcId: !Ref JenkinsVpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr}
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: !Ref AdminCidr}
  JenkinsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hww-jenkins-controller-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: AssumeHwwTeamDeployRoles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/hww-team*-deploy'
  JenkinsProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref JenkinsRole]}
  JenkinsInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref JenkinsProfile
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref JenkinsSecurityGroup]
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeType: gp3, VolumeSize: 80, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: hww-jenkins-server}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf update -y
          dnf install -y java-21-amazon-corretto-headless git maven docker python3 jq nodejs npm awscli
          systemctl enable --now docker
          usermod -aG docker ec2-user
          wget -O /etc/yum.repos.d/jenkins.repo https://pkg.jenkins.io/redhat-stable/jenkins.repo
          rpm --import https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
          dnf install -y jenkins
          usermod -aG docker jenkins
          systemctl enable --now jenkins
Outputs:
  JenkinsPublicIp: {Value: !GetAtt JenkinsInstance.PublicIp}
  JenkinsUrl: {Value: !Sub 'http://${JenkinsInstance.PublicDnsName}:8080'}
  JenkinsRoleArn: {Value: !GetAtt JenkinsRole.Arn}
  JenkinsInstanceId: {Value: !Ref JenkinsInstance}
