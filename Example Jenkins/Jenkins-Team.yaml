AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Hello World Wealth per-team Jenkins controller (classroom; instructor managed).
  Deploy once per team, passing TeamTag=team1 .. team4. Each team gets its own VPC,
  security group, IAM role and EC2 instance.

Parameters:
  TeamTag:
    Type: String
    Description: Team this Jenkins belongs to, team1 to team4. Also selects the hww-<team>-deploy role it may assume.
    AllowedValues: [team1, team2, team3, team4]
  AdminCidr:
    Type: String
    Description: Instructor public IPv4 CIDR, e.g. 203.0.113.5/32
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
  InstanceType:
    Type: String
    Default: t3.large
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Mappings:
  # Each team gets its own address range, so the four networks can be joined later if needed.
  TeamNetwork:
    team1: {VpcCidr: 10.91.0.0/16, SubnetCidr: 10.91.1.0/24}
    team2: {VpcCidr: 10.92.0.0/16, SubnetCidr: 10.92.1.0/24}
    team3: {VpcCidr: 10.93.0.0/16, SubnetCidr: 10.93.1.0/24}
    team4: {VpcCidr: 10.94.0.0/16, SubnetCidr: 10.94.1.0/24}

Resources:
  JenkinsVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [TeamNetwork, !Ref TeamTag, VpcCidr]
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - {Key: Name, Value: !Sub 'hww-jenkins-${TeamTag}-vpc'}
        - {Key: team, Value: !Select [1, !Split ['team', !Ref TeamTag]]}
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub 'hww-jenkins-${TeamTag}-igw'}
        - {Key: team, Value: !Select [1, !Split ['team', !Ref TeamTag]]}
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref JenkinsVpc, InternetGatewayId: !Ref InternetGateway}
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref JenkinsVpc
      CidrBlock: !FindInMap [TeamNetwork, !Ref TeamTag, SubnetCidr]
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub 'hww-jenkins-${TeamTag}-public'}
        - {Key: team, Value: !Select [1, !Split ['team', !Ref TeamTag]]}
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref JenkinsVpc
      Tags:
        - {Key: Name, Value: !Sub 'hww-jenkins-${TeamTag}-rt'}
        - {Key: team, Value: !Select [1, !Split ['team', !Ref TeamTag]]}
  PublicInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties: {RouteTableId: !Ref PublicRoutes, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {RouteTableId: !Ref PublicRoutes, SubnetId: !Ref PublicSubnet}
  JenkinsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Instructor-only Jenkins and SSH
      VpcId: !Ref JenkinsVpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr}
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: !Ref AdminCidr}
      Tags:
        - {Key: Name, Value: !Sub 'hww-jenkins-${TeamTag}-sg'}
        - {Key: team, Value: !Select [1, !Split ['team', !Ref TeamTag]]}
  JenkinsRole:
    Type: AWS::IAM::Role
    Properties:
      # Named per team so four stacks can exist side by side.
      RoleName: !Sub 'hww-jenkins-${TeamTag}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: AssumeOwnTeamDeployRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Only this team's deploy role, not hww-team*-deploy.
              - Effect: Allow
                Action: 'sts:AssumeRole'
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/hww-${TeamTag}-deploy'
      Tags:
        - {Key: team, Value: !Select [1, !Split ['team', !Ref TeamTag]]}
  JenkinsProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref JenkinsRole]}
  JenkinsInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref JenkinsProfile
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref JenkinsSecurityGroup]
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeType: gp3, VolumeSize: 80, Encrypted: true, DeleteOnTermination: true}
      Tags:
        - {Key: Name, Value: !Sub 'hww-jenkins-${TeamTag}'}
        - {Key: team, Value: !Select [1, !Split ['team', !Ref TeamTag]]}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf update -y
          dnf install -y java-21-amazon-corretto-headless git maven docker python3 jq nodejs npm awscli
          systemctl enable --now docker
          usermod -aG docker ec2-user
          wget -O /etc/yum.repos.d/jenkins.repo https://pkg.jenkins.io/redhat-stable/jenkins.repo
          rpm --import https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
          dnf install -y jenkins
          usermod -aG docker jenkins
          systemctl enable --now jenkins
Outputs:
  Team: {Value: !Ref TeamTag}
  JenkinsPublicIp: {Value: !GetAtt JenkinsInstance.PublicIp}
  JenkinsUrl: {Value: !Sub 'http://${JenkinsInstance.PublicDnsName}:8080'}
  JenkinsRoleArn: {Value: !GetAtt JenkinsRole.Arn}
  JenkinsInstanceId: {Value: !Ref JenkinsInstance}
  DeployRoleItMayAssume: {Value: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/hww-${TeamTag}-deploy'}
